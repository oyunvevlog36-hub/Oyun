name: APK Olustur
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ArtemSBulgakov/buildozer-action@v1
        with:
          buildozer_version: stable
          command: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: 3D-Savas-APK
          path: bin/*.apk
